name: Windows build and self-tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Papergraph.csproj -c Release -o artifacts/build
      - name: Run isolated desktop self-tests
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/build/papergraph.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content ./artifacts/build/test-failure.txt
            throw 'Self-tests failed'
          }
          Get-Content ./artifacts/build/test-results.txt
      - name: LAN sync merge, recovery and loopback TLS tests
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/build/papergraph.exe -ArgumentList '--lan-sync-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content ./artifacts/build/test-failure.txt
            throw 'LAN sync tests failed'
          }
      - name: Package Windows preview
        shell: pwsh
        run: |
          [xml]$project = Get-Content Papergraph.csproj
          $version = $project.Project.PropertyGroup.Version
          dotnet publish Papergraph.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          Copy-Item LICENSE artifacts/publish/LICENSE
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/Papergraph-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Papergraph-Windows-preview
          path: artifacts/*.zip
          if-no-files-found: error
      - name: Upload Windows test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-evidence
          path: |
            artifacts/build/test-results.txt
            artifacts/build/test-failure.txt
            artifacts/build/*.png
