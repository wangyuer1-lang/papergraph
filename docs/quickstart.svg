<text x="1060" y="378" class="body"><tspan x="1060">State one claim clearly.</tspan><tspan x="1060" dy="32">Make it specific enough</tspan><tspan x="1060" dy="32">to check and discuss.</tspan></text>
<text x="1060" y="530" class="small muted">Select a point to edit its text.</text>
<path d="M1060 567 H1360" stroke="#d6dfe9"/>
<text x="1060" y="597" class="small muted">Notes</text>
<text x="1060" y="631" class="body"><tspan x="1060">Source: author, year, page</tspan><tspan x="1060" dy="30">Evidence: what supports it?</tspan><tspan x="1060" dy="30">Limits: what remains unclear?</tspan></text>
<text x="78" y="751" font-size="12" class="muted">ILLUSTRATED WORKSPACE · SYNTHETIC EXAMPLE</text>
<g transform="translate(56 811)"><text y="0" class="label">1  Create a graph</text><text y="30" class="small muted"><tspan x="0">Click + beside Graphs.</tspan><tspan x="0" dy="24">Give your paper a title.</tspan></text></g>
<g transform="translate(397 811)"><text y="0" class="label">2  Write propositions</text><text y="30" class="small muted"><tspan x="0">Double-click the canvas.</tspan><tspan x="0" dy="24">Keep sources in Notes.</tspan></text></g>
<g transform="translate(738 811)"><text y="0" class="label">3  Explain relations</text><text y="30" class="small muted"><tspan x="0">Drag a connection handle.</tspan><tspan x="0" dy="24">Select an arrow to add notes.</tspan></text></g>
<g transform="translate(1071 811)"><text y="0" class="label">4  Organize the argument</text><text y="30" class="small muted"><tspan x="0">Use regions or connected rings.</tspan><tspan x="0" dy="24">A ring can connect as a whole.</tspan></text></g>
<rect x="56" y="906" width="1328" height="125" rx="14" fill="#e9eff7"/>
<circle cx="90" cy="943" r="15" fill="#356fbd"/><text x="85" y="949" class="num">5</text>
<text x="116" y="950" font-size="23" font-weight="600">Work with an external agent. Keep the review in your hands.</text>
<text x="80" y="984" class="body">Agent: read, search, add independent propositions.    Author: inspect evidence, revise claims, connect the argument.</text>
<text x="80" y="1011" class="small muted">Current local API · no built-in model or Zotero search · agent additions do not create relations</text>
<text x="56" y="1061" class="small muted">Pan: left-drag     Zoom: mouse wheel     Select: right-drag     Show titles: Space     Fit: F</text>
