<title id="title">papergraph — Write a paper you can inspect</title>
<desc id="description">Illustrated workflow showing a graph list, proposition nodes, relation arrows, a circular argument group, a rectangular section and a writing panel. Five steps cover creating, writing, connecting, grouping and collaborating with an external agent.</desc>
